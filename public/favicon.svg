<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Bancada mark, simplified variant for renders at 32px and below:
       no bevel, single-step pulse, thicker strokes and legs. -->
  <rect x="0" y="0" width="512" height="512" rx="115" fill="#1a1f2e"/>

  <!-- lamp, no glow ring -->
  <circle cx="256" cy="124" r="52" fill="#fbbf24"/>

  <!-- benchtop slab -->
  <rect x="56" y="216" width="400" height="96" fill="#2dd4bf"/>

  <!-- single square step, heavy stroke -->
  <path d="M 96 282 H 208 V 246 H 300"
        fill="none" stroke="#1a1f2e" stroke-width="22"
        stroke-linecap="butt" stroke-linejoin="miter"/>

  <!-- thick straight legs -->
  <rect x="104" y="312" width="68" height="144" fill="#2dd4bf"/>
  <rect x="340" y="312" width="68" height="144" fill="#2dd4bf"/>
</svg>
