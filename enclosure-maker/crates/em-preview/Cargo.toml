[package]
name = "em-preview"
edition.workspace = true
version.workspace = true

[[bin]]
name = "enclosure-maker"
path = "src/main.rs"

[dependencies]
em-agent = { workspace = true }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "fs", "time", "process", "io-util"] }
axum = { version = "0.8", features = ["ws"] }
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
futures-util = "0.3"

[dev-dependencies]
tokio-tungstenite = "0.29"
