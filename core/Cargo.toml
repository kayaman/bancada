[package]
name = "bancada-core"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Backend bridge to arduino-cli and esptool: boards, builds, libraries, sketch.yaml"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
# default-features off: we only open/read/write ports (no enumeration), which
# avoids the libudev requirement on Linux — arduino-cli does port discovery.
serialport = { version = "4", default-features = false }
thiserror = "1"
# MQTT client for the Observability panel. default-features off: sync
# Client/Connection over plain TCP, no rustls. Note: rumqttc's sync client
# spins an internal tokio runtime — tokio enters the dep tree, but Bancada's
# own code stays std::thread (scope-reader discipline).
rumqttc = { version = "0.24", default-features = false }
# Non-UTF-8 MQTT payloads cross the JSON channel base64-encoded (b64:true).
base64 = "0.22"
# Explorer deletes go to the OS trash, never straight to fs::remove.
trash = "5"
# .vsix colour-theme packages are zips. default-features off: we only read,
# and only deflate — the AES/bzip2/zstd/lzma backends are optional weight for
# formats no .vsix uses. Nothing is ever extracted to disk (see vstheme.rs),
# so this crate's job stays confined to inflating bytes in memory.
zip = { version = "2", default-features = false, features = ["deflate"] }

[dev-dependencies]
tempfile = "3"
# tests/vstheme.rs builds .vsix fixtures; integration tests link the crate,
# not the crate's dependencies, so zip has to be named again here.
zip = { version = "2", default-features = false, features = ["deflate"] }
