[package]
name = "bancada"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "An Arduino workbench: editor, library manager and board utilities on top of arduino-cli"

[lib]
name = "bancada_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
bancada-core = { path = "../core" }
base64 = "0.22"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Loopback MCP listener for the agent panel's `verify` tool. No reusable
# server exists in the workspace already — hyper/reqwest are tauri's
# client-side transitives, not ours to drive.
tiny_http = "0.12"
# Outbound half of the device-browser proxy (tiny_http is server-only).
# Plain http on purpose: bench devices don't serve TLS, and the proxy
# refuses https targets up front (core::devproxy::parse_target).
ureq = { version = "2", default-features = false }

# SIGTERM, which std cannot send: `Child::kill` is SIGKILL only, and a child
# that spawns helpers of its own has to handle the signal itself — the agent's
# `claude` session today; historically the `arduino-cli monitor` child whose
# `serial-monitor` grandchild survived as an orphan holding the tty (see
# `kill_child`). Already in the tree transitively (serialport, tauri), so this
# adds no compilation.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"
