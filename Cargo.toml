[workspace]
resolver = "2"
members = [
    "core",
    "src-tauri",
    "enclosure-maker/crates/em-core",
    "enclosure-maker/crates/em-csg",
    "enclosure-maker/crates/em-primitives",
    "enclosure-maker/crates/em-hardware",
    "enclosure-maker/crates/em-export",
    "enclosure-maker/crates/em-script",
    "enclosure-maker/crates/em-agent",
    "enclosure-maker/crates/em-preview",
    "enclosure-maker/crates/em-projects",
]

[workspace.package]
version = "0.25.0"
edition = "2021"
authors = ["marco <m@rco.sh>"]
license = "MIT"

# Path deps for the enclosure-maker crates merged in from the sibling repo
# (see enclosure-maker/README.md) -- `{ workspace = true }` in their own
# Cargo.tomls resolves against these, unchanged from how that repo's own
# root Cargo.toml declared them, just re-rooted under enclosure-maker/.
[workspace.dependencies]
em-core = { path = "enclosure-maker/crates/em-core" }
em-csg = { path = "enclosure-maker/crates/em-csg" }
em-primitives = { path = "enclosure-maker/crates/em-primitives" }
em-hardware = { path = "enclosure-maker/crates/em-hardware" }
em-export = { path = "enclosure-maker/crates/em-export" }
em-script = { path = "enclosure-maker/crates/em-script" }
em-agent = { path = "enclosure-maker/crates/em-agent" }
thiserror = "2"
