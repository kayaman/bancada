<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>enclosure-maker preview</title>
  <style>
    html, body { margin: 0; height: 100%; background: #1e1f22; overflow: hidden; color-scheme: dark; }
    #layout { display: flex; height: 100%; }
    #viewport { position: relative; flex: 1; min-width: 160px; overflow: hidden; }
    #viewport canvas { position: absolute; inset: 0; display: block; }
    #status, #controls-hint {
      position: fixed; left: 12px; z-index: 10;
      font: 12px/1.4 -apple-system, BlinkMacSystemFont, sans-serif;
      color: #9aa0a6; background: rgba(0,0,0,0.35); padding: 4px 8px; border-radius: 4px;
    }
    #status { bottom: 32px; max-width: min(480px, 60vw); white-space: pre-wrap; }
    #controls-hint { bottom: 8px; }
    #toolbar {
      position: absolute; top: 8px; right: 12px; z-index: 11;
      display: flex; gap: 6px; margin-bottom: 6px;
    }
    #toolbar button, #toolbar a {
      font: 12px/1.4 -apple-system, BlinkMacSystemFont, sans-serif;
      color: #e1e3e6; background: rgba(0,0,0,0.5); border: 1px solid rgba(255,255,255,0.12);
      padding: 6px 10px; border-radius: 6px; cursor: pointer; text-decoration: none;
      display: inline-block;
    }
    #toolbar button:hover, #toolbar a:hover { background: rgba(255,255,255,0.1); }
    #toolbar button:disabled { opacity: 0.5; cursor: default; }
    #save-btn[hidden], #code-btn[hidden], #preview-btn[hidden] { display: none; }
    #model-tools {
      position: absolute; top: 44px; right: 12px; bottom: 44px; z-index: 10;
      width: 280px; max-width: calc(100% - 24px); overflow-y: auto;
      padding: 12px; box-sizing: border-box; border-radius: 8px;
      color: #e1e3e6; background: rgba(20,21,24,0.94);
      font: 12px/1.4 -apple-system, BlinkMacSystemFont, sans-serif;
    }
    #model-tools h2, #model-tools h3 { margin: 0 0 8px; font-size: 12px; }
    #model-tools h3 { margin-top: 16px; color: #9aa0a6; }
    #model-tools button, #model-tools select, #model-tools input[type="number"] {
      color: #e1e3e6; background: #292c32; border: 1px solid #454953;
      border-radius: 4px; padding: 5px; font: inherit; box-sizing: border-box;
    }
    #model-tools button { cursor: pointer; }
    #model-tools button:disabled { opacity: 0.4; cursor: default; }
    #model-tools button[aria-pressed="true"] { border-color: #729cff; background: #253b63; }
    #part-select { width: 100%; }
    .tool-row { display: flex; gap: 5px; margin: 8px 0; }
    .tool-row button { flex: 1; }
    .axis-fields { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
    .axis-fields label { color: #aeb6c5; }
    .axis-fields input { width: 100%; margin-top: 3px; }
    #object-feedback { color: #aeb6c5; min-height: 18px; margin-top: 8px; overflow-wrap: anywhere; }
    #model-tools details { margin-top: 10px; }
    #model-tools summary { cursor: pointer; color: #aeb6c5; }
    .code-control { display: grid; grid-template-columns: 1fr 82px; align-items: center; gap: 8px; margin: 8px 0; }
    .code-control input { width: 100%; }
    #params {
      position: static; margin-top: 14px;
      font: 12px/1.4 -apple-system, BlinkMacSystemFont, sans-serif;
      color: #e1e3e6; background: rgba(0,0,0,0.5); border-radius: 6px;
      overflow: hidden;
    }
    #params[hidden] { display: none; }
    #params-header {
      display: flex; justify-content: space-between; align-items: center;
      padding: 8px 10px; color: #9aa0a6; font-size: 11px; text-transform: uppercase;
      letter-spacing: 0.04em;
    }
    #params-header button {
      cursor: pointer; background: none; border: none; color: #9aa0a6;
      font-size: 13px; padding: 2px 6px; border-radius: 3px; line-height: 1;
    }
    #params-header button:hover { color: #e1e3e6; background: rgba(255,255,255,0.08); }
    #params-body { padding: 0 12px 8px; }
    #params.collapsed { min-width: 0; }
    #params.collapsed #params-body { display: none; }
    .param-row {
      display: grid; grid-template-columns: 1fr 72px 25px; gap: 8px; align-items: center;
      margin: 6px 0;
    }
    .param-row label { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .param-row input[type="range"] { width: 100%; grid-column: 1 / -1; }
    .param-value { font-variant-numeric: tabular-nums; text-align: right; min-width: 3.5em; }
    #code-splitter {
      width: 5px; flex: none; cursor: col-resize; background: #2a2c30; user-select: none;
    }
    #code-splitter:hover, #code-splitter.dragging { background: #4a7dd8; }
    #layout.code-collapsed #code-splitter,
    #layout.code-collapsed #code-pane { display: none; }
    #code-pane {
      width: 420px; flex: none; min-height: 0; display: flex; flex-direction: column;
      background: #16171a;
    }
    #code-header {
      padding: 8px 10px; color: #9aa0a6; font: 11px/1.4 -apple-system, BlinkMacSystemFont, sans-serif;
      text-transform: uppercase; letter-spacing: 0.04em;
      border-bottom: 1px solid rgba(255,255,255,0.08);
      display: flex; justify-content: space-between; align-items: center; gap: 8px;
    }
    #code-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    #code-collapse {
      cursor: pointer; background: none; border: none; color: #9aa0a6;
      font-size: 13px; padding: 2px 6px; border-radius: 3px; flex: none;
    }
    #code-collapse:hover { color: #e1e3e6; background: rgba(255,255,255,0.08); }
    #code {
      flex: 1; min-width: 0; min-height: 0; width: 100%; box-sizing: border-box;
      margin: 0; padding: 10px 12px; border: none; resize: none; outline: none;
      overflow: auto; background: transparent; color: #e1e3e6;
      font: 13px/1.45 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      tab-size: 2; white-space: pre;
    }

    #chat {
      position: fixed; left: 12px; top: 8px; bottom: 40px; z-index: 10;
      width: 320px; max-width: calc(100vw - 24px);
      display: flex; flex-direction: column;
      font: 13px/1.4 -apple-system, BlinkMacSystemFont, sans-serif;
      background: rgba(20,21,24,0.85); border-radius: 8px; overflow: hidden;
      box-shadow: 0 4px 16px rgba(0,0,0,0.4);
    }
    #chat-header {
      padding: 8px 10px; color: #9aa0a6; font-size: 11px; text-transform: uppercase;
      letter-spacing: 0.04em; border-bottom: 1px solid rgba(255,255,255,0.08);
      display: flex; justify-content: space-between; align-items: center;
    }
    #chat-header-actions { display: flex; align-items: center; gap: 2px; }
    #assistant-provider {
      color: #c7cbd1; background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.1); border-radius: 4px;
      font: inherit; text-transform: none; padding: 2px 4px;
    }
    #chat-header-actions button {
      cursor: pointer; background: none; border: none; color: #9aa0a6;
      font: 11px/1.4 -apple-system, BlinkMacSystemFont, sans-serif;
      text-transform: uppercase; letter-spacing: 0.04em; padding: 2px 6px; border-radius: 3px;
    }
    #chat-header-actions button:hover { color: #e1e3e6; background: rgba(255,255,255,0.08); }
    #chat-toggle { font-size: 13px !important; text-transform: none !important; }
    #chat-log { flex: 1; overflow-y: auto; padding: 8px 10px; color: #e1e3e6; }
    #chat.collapsed #chat-log, #chat.collapsed #chat-form { display: none; }
    #chat.collapsed { bottom: auto; }

    #history-panel {
      position: absolute; inset: 0; background: rgba(20,21,24,0.98); z-index: 1;
      display: flex; flex-direction: column;
    }
    #history-panel[hidden] { display: none; }
    #history-panel-header {
      padding: 8px 10px; color: #9aa0a6; font-size: 11px; text-transform: uppercase;
      letter-spacing: 0.04em; border-bottom: 1px solid rgba(255,255,255,0.08);
      display: flex; justify-content: space-between; align-items: center;
    }
    #history-list { flex: 1; overflow-y: auto; }
    .history-empty { padding: 12px 10px; color: #6b7076; font-size: 12px; font-style: italic; }
    .history-item {
      display: flex; align-items: center; gap: 6px; padding: 8px 10px;
      border-bottom: 1px solid rgba(255,255,255,0.05); cursor: pointer;
    }
    .history-item:hover { background: rgba(255,255,255,0.05); }
    .history-item-text { flex: 1; min-width: 0; }
    .history-item-title {
      color: #e1e3e6; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .history-item-time { color: #6b7076; font-size: 11px; }
    .history-item-delete {
      background: none; border: none; color: #6b7076; cursor: pointer; font-size: 14px;
      padding: 2px 6px; line-height: 1;
    }
    .history-item-delete:hover { color: #ff7b7b; }
    .chat-msg { margin: 6px 0; white-space: pre-wrap; word-break: break-word; }
    .chat-msg.user { color: #7fb3ff; }
    .chat-msg.assistant { color: #e1e3e6; }
    .chat-msg.tool { color: #c9a5ff; }
    .chat-msg.thinking {
      color: #8b919a; font-size: 12px; font-style: italic;
      border-left: 2px solid rgba(255,255,255,0.12); padding-left: 8px;
      max-height: 9em; overflow-y: auto;
    }
    .chat-msg.system { color: #6b7076; font-size: 11px; font-style: italic; }
    .chat-msg.error { color: #ff7b7b; }
    #chat-form { display: flex; gap: 6px; padding: 8px; border-top: 1px solid rgba(255,255,255,0.08); }
    #chat-input {
      flex: 1; background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.12);
      border-radius: 4px; color: #e1e3e6; padding: 6px 8px; font: inherit; resize: none;
    }
    #chat-send {
      background: #4a7dd8; border: none; border-radius: 4px; color: white; padding: 0 12px;
      cursor: pointer; font: inherit;
    }
    #chat-send:disabled { opacity: 0.5; cursor: default; }
  </style>
</head>
<body>
  <div id="status">connecting…</div>
  <div id="controls-hint">drag to orbit &middot; scroll to zoom &middot; right-drag to pan</div>
  <div id="layout" class="code-collapsed">
    <div id="viewport">
      <div id="toolbar">
        <button id="code-btn" title="Show the script">Code</button>
        <button id="preview-btn" hidden disabled title="Render the current script">Preview</button>
        <button id="save-btn" hidden title="Save current dimension values as the script defaults">Save</button>
        <a id="export-btn" href="/export.stl" download>Export</a>
      </div>
      <aside id="model-tools" aria-label="Model controls">
        <h2>Model controls</h2>
        <label for="part-select">Part</label>
        <select id="part-select" disabled><option>Building model…</option></select>
        <div class="tool-row">
          <button id="move-tool" aria-pressed="true" title="Move selected part (W)">Move</button>
          <button id="rotate-tool" aria-pressed="false" title="Rotate selected part (E)">Rotate</button>
          <button id="fit-model" title="Fit all parts in view">Fit</button>
        </div>
        <div class="tool-row" aria-label="Camera views">
          <button data-view="iso">3D</button><button data-view="top">Top</button>
          <button data-view="front">Front</button><button data-view="right">Right</button>
        </div>
        <label><input id="snap-transform" type="checkbox" /> Snap: 1 mm / 15°</label>
        <h3>Move from original position (mm)</h3>
        <div class="axis-fields">
          <label>X<input id="move-x" type="number" step="any" value="0" disabled /></label>
          <label>Y<input id="move-y" type="number" step="any" value="0" disabled /></label>
          <label>Z<input id="move-z" type="number" step="any" value="0" disabled /></label>
        </div>
        <h3>Rotate about part center (°)</h3>
        <div class="axis-fields">
          <label>X<input id="rotate-x" type="number" step="any" value="0" disabled /></label>
          <label>Y<input id="rotate-y" type="number" step="any" value="0" disabled /></label>
          <label>Z<input id="rotate-z" type="number" step="any" value="0" disabled /></label>
        </div>
        <div class="tool-row">
          <button id="undo-transform" disabled>Undo</button><button id="redo-transform" disabled>Redo</button>
          <button id="reset-transform" disabled>Reset</button>
        </div>
        <div id="object-feedback" role="status">Click a part to select it.</div>
      <div id="params" hidden>
        <div id="params-header">
          <span>Dimensions</span>
          <button id="params-toggle" title="Collapse">−</button>
        </div>
        <div id="params-body"></div>
      </div>
        <details id="code-dimensions" open><summary>Shape &amp; hardware dimensions</summary><div id="code-controls"></div></details>
      </aside>
    </div>
    <div id="code-splitter"></div>
    <div id="code-pane">
      <div id="code-header">
        <span id="code-name">script</span>
        <button id="code-collapse" title="Collapse">&minus;</button>
      </div>
      <textarea id="code" spellcheck="false" autocomplete="off"></textarea>
    </div>
  </div>
  <div id="chat" class="collapsed">
    <div id="chat-header">
      <select id="assistant-provider" aria-label="AI assistant">
        <option value="claude">Claude</option>
        <option value="codex">Codex</option>
        <option value="copilot">Copilot</option>
      </select>
      <div id="chat-header-actions">
        <button id="new-chat-btn" title="Start a new chat">New</button>
        <button id="history-btn" title="Chat history">History</button>
        <button id="chat-toggle" title="Expand">+</button>
      </div>
    </div>
    <div id="chat-log"></div>
    <form id="chat-form">
      <textarea id="chat-input" rows="1" placeholder="Ask for a change…"></textarea>
      <button id="chat-send" type="submit">Send</button>
    </form>
    <div id="history-panel" hidden>
      <div id="history-panel-header">
        <span>History</span>
        <button id="history-close-btn" title="Close">&times;</button>
      </div>
      <div id="history-list"></div>
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/TransformControls.js"></script>
  <script src="/model-tools.js"></script>
  <script src="/preview.js"></script>
</body>
</html>
